[project]
name = "piper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pathvalidate>=3.3.1", "pip>=26.1.1"]

[project.optional-dependencies]
dev = [
  "build>=1.5.0",
  "cmake>=4.3.2",
  "isort>=8.0.1",
  "ninja>=1.13.0",
  "scikit-build>=0.19.0",
  "setuptools>=82.0.1",
  "wheel>=0.47.0",
]

test = [
  "piper[dev]",
  "pytest>=9.0.3",
  "vosk>=0.3.45",
  "soundfile>=0.13.1",
  "librosa>=0.11.0",
  "numpy>=2.4.6",
  "onnxruntime>=1.26.0",
]

[build-system]
requires = ["scikit-build", "setuptools", "wheel", "cmake", "ninja"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "black>=26.5.1",
  "cmakelang>=0.6.13",
  "hatch>=1.16.5",
  "mypy>=2.1.0",
  "pyright>=1.1.409",
  "ruff>=0.15.13",
]


[tool.hatch.envs.default]
path = ".hatch"

[tool.hatch.envs.build]
dependencies = ["piper[dev]"]

[tool.hatch.envs.build.scripts]
piper_py = "python setup.py build_ext --inplace"
all = ["piper_py"]


[tool.hatch.envs.clean]
detached = true
skip_install = true

[tool.hatch.envs.clean.scripts]
all = "git clean -ffdx -e .venv -e .claude -e CLAUDE.local.md"

# Format environment - runs code formatters (black, cmake-format)
[tool.hatch.envs.format]
detached = true
skip_install = true
dependency-groups = ["dev"]

[tool.hatch.envs.format.scripts]
cmake = "find cmake -name '*.cmake' -o -name 'CMakeLists.txt' | xargs cmake-format -i"
ruff = "sh -c 'ruff format tests/divergence_tests/ wasm_piper/'"
all = ["cmake", "ruff"]

# Lint environment - runs mypy (divergence tests + wasm_piper), pyright, ruff, cmake-lint
[tool.hatch.envs.lint]
detached = true
skip_install = true
dependencies = ["piper[test]"]
dependency-groups = ["dev"]

[tool.hatch.envs.lint.scripts]
mypy = "python -m mypy"
pyright = "python -m pyright"
ruff = "sh -c 'ruff check tests/divergence_tests/ wasm_piper/ --fix'"
cmake = "find cmake -name '*.cmake' -o -name 'CMakeLists.txt' | xargs cmake-lint --disabled-codes=C0301"
all = ["hatch run format:all", "mypy", "pyright", "ruff", "cmake"]

# Divergence test environment - cross-variant audio similarity (Python vs native vs WASM)
[tool.hatch.envs.divergence]
dependencies = ["piper[test]"]
post-install-commands = ["python tests/divergence_tests/build.py all"]

[tool.hatch.envs.divergence.scripts]
test = "pytest tests/divergence_tests/ -v {args}"
all = "pytest tests/divergence_tests/ -v"

[tool.black]
exclude = '''
(
    \.pyi$
)
'''

[tool.mypy]
strict = true
explicit_package_bases = true
follow_imports = "silent"

files = ["tests/divergence_tests", "wasm_piper"]

exclude = '''
(?x)(
    build/|
    __pycache__/|
    \.egg-info/|
    _skbuild/|
    ^wasm_piper/node_modules/
)
'''

mypy_path = ["src", "tests/divergence_tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "C4", "ARG", "N"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
